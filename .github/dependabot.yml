version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
      shiki:
        patterns:
          - "@shikijs/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
